<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFCF0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Soudeur — Horaires</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <label class="setting-card" id="nocturne-toggle">
        <span class="setting-card__title">Nocturne</span>
        <input
          type="checkbox"
          id="nocturne-input"
          class="setting-card__input"
        />
        <span class="setting-card__switch" aria-hidden="true">
          <span class="setting-card__thumb"></span>
        </span>
      </label>

      <section class="hero" aria-live="polite">
        <p class="hero__time" id="hero-time">—</p>
        <p class="hero__label" id="hero-label">Prochain,</p>
      </section>

      <section class="stat" aria-live="polite">
        <p class="stat__value" id="stat-value">0</p>
        <p class="stat__label" id="stat-label">créneau restant</p>
      </section>

      <section class="meta">
        <p class="meta__day" id="schedule-label">Journée normale</p>
        <p class="meta__hint" id="hint"></p>
      </section>

      <section class="shows" aria-labelledby="shows-heading">
        <h2 class="shows__heading" id="shows-heading">Aujourd’hui</h2>
        <ol class="shows__list" id="timeline"></ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
