<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFCF0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Soudeur — Horaires</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <svg
          class="top__mark"
          viewBox="0 0 32 32"
          aria-hidden="true"
          width="44"
          height="44"
        >
          <path
            fill="currentColor"
            d="M7 22.5c0-1.2.5-2.3 1.4-3.1l5.1-4.6c.9-.8 2.2-.8 3.1 0l5.1 4.6c.9.8 1.4 1.9 1.4 3.1V26H7v-3.5zm4.2-12.1 3.3-4.2c.8-1 2.3-1 3.1 0l3.3 4.2c.7.9.1 2.2-1 2.2h-7.7c-1.1 0-1.7-1.3-1-2.2z"
          />
        </svg>
        <label class="check" id="nocturne-toggle">
          <span class="check__label">Nocturne</span>
          <input
            type="checkbox"
            id="nocturne-input"
            class="check__input"
          />
          <span class="check__box" aria-hidden="true"></span>
        </label>
      </header>

      <section class="hero" aria-live="polite">
        <p class="hero__time" id="hero-time">—</p>
        <p class="hero__label" id="hero-label">Prochain,</p>
      </section>

      <section class="stat" aria-live="polite">
        <p class="stat__value" id="stat-value">0</p>
        <p class="stat__label" id="stat-label">créneau restant</p>
      </section>

      <section class="meta">
        <p class="meta__day" id="schedule-label">Journée normale</p>
        <p class="meta__hint" id="hint"></p>
      </section>

      <section class="shows" aria-labelledby="shows-heading">
        <h2 class="shows__heading" id="shows-heading">Aujourd’hui</h2>
        <ol class="shows__list" id="timeline"></ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
